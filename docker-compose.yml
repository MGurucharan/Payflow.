version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DatabaseConnectionString: "Host=postgres;Port=5432;Username=guru;Password=gurucharan;Database=guru;SslMode=Disable"
    depends_on:
      - postgres
    networks:
      - backend

  postgres:
    container_name: container-pg
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: gurucharan
      POSTGRES_DB: guru
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - backend

  pgadmin:
    container_name: container-pgadmin
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    restart: always
    networks:
      - backend

volumes:
  local_pgdata:

networks:
  backend:
    driver: bridge
