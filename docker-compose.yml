version: '5.5.0'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:75"
    environment:
      - DB_HOST= postgres
      - ASPNETCORE_URLS=http://+80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DatabaseConnectionString=Host=postgres;username=guru;password=gurucharan;database=guru;TrustServerCertificate=True;
    depends_on:
      - postgres
    networks:
      - backend

  postgres:
    container_name: container-pg
    image: postgres
    hostname: localhost
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: gurucharan
      
    volumes:
      - local_pgdata:/var/lib/postgresql
    restart: always
    networks:
      - backend

  pgadmin:
    container_name: container-pgadmin
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    restart: always

volumes:
  postgres-data:
  local_pgdata:

networks:
  backend:
    driver: bridge
  