version: '5.5.0'
services:
  postgres:
    container_name: container-pg
    image: postgres
    hostname: localhost
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: gurucharan
    volumes:
      - local_pgdata:/var/lib/postgresql
    restart: always

  pgadmin:
    container_name: container-pgadmin
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    restart: always

volumes:
  postgres-data:
  local_pgdata:
  